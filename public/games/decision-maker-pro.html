<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>命运之轮 - 遇事不决</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'SF Pro Display', -apple-system, 'PingFang SC', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 星空背景 */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, #0a0a2e 0%, #000 100%);
    }

    .stars::before,
    .stars::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #fff, transparent),
        radial-gradient(2px 2px at 40px 70px, rgba(255,255,255,0.8), transparent),
        radial-gradient(1px 1px at 90px 40px, #fff, transparent),
        radial-gradient(2px 2px at 130px 80px, rgba(255,255,255,0.6), transparent),
        radial-gradient(1px 1px at 160px 120px, #fff, transparent);
      background-size: 200px 200px;
      animation: twinkle 5s ease-in-out infinite;
    }

    .stars::after {
      background-image: 
        radial-gradient(1px 1px at 50px 100px, rgba(255,255,255,0.5), transparent),
        radial-gradient(2px 2px at 100px 50px, #fff, transparent),
        radial-gradient(1px 1px at 150px 150px, rgba(255,255,255,0.7), transparent);
      background-size: 250px 250px;
      animation-delay: 2s;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* 流星 */
    .meteor {
      position: fixed;
      width: 2px;
      height: 100px;
      background: linear-gradient(to bottom, rgba(255,255,255,0.8), transparent);
      animation: meteor 3s linear infinite;
      opacity: 0;
    }

    .meteor:nth-child(1) { left: 20%; animation-delay: 0s; }
    .meteor:nth-child(2) { left: 50%; animation-delay: 1.5s; }
    .meteor:nth-child(3) { left: 80%; animation-delay: 3s; }

    @keyframes meteor {
      0% { transform: translateY(-100px) rotate(45deg); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(100vh) rotate(45deg); opacity: 0; }
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 500px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .back-link {
      display: inline-block;
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 20px;
      transition: color 0.3s;
    }

    .back-link:hover { color: #fff; }

    .title {
      text-align: center;
      font-size: 32px;
      font-weight: 300;
      margin-bottom: 8px;
      letter-spacing: 8px;
      background: linear-gradient(135deg, #fff 0%, #888 50%, #fff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      letter-spacing: 4px;
      margin-bottom: 40px;
    }

    /* 卡片 */
    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 28px;
      backdrop-filter: blur(20px);
      margin-bottom: 24px;
    }

    .input-section label {
      display: block;
      font-size: 13px;
      font-weight: 400;
      margin-bottom: 16px;
      color: rgba(255,255,255,0.6);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .input-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .input-row input {
      flex: 1;
      padding: 16px 20px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      font-size: 15px;
      background: rgba(0,0,0,0.3);
      color: #fff;
      outline: none;
      transition: all 0.3s;
    }

    .input-row input:focus {
      border-color: rgba(255,255,255,0.4);
      background: rgba(0,0,0,0.5);
    }

    .input-row input::placeholder {
      color: rgba(255,255,255,0.25);
    }

    .btn {
      padding: 16px 24px;
      border: none;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
    }

    .btn-add {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.8);
      border: 1px solid rgba(255,255,255,0.15);
    }

    .btn-add:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.3);
    }

    .options-list {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 20px;
      min-height: 44px;
    }

    .option-tag {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 18px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 24px;
      font-size: 14px;
      color: rgba(255,255,255,0.85);
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .option-tag .remove {
      cursor: pointer;
      font-size: 16px;
      opacity: 0.4;
      transition: opacity 0.2s;
    }

    .option-tag .remove:hover { opacity: 1; }

    .count-hint {
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      margin-bottom: 8px;
    }

    .btn-go {
      width: 100%;
      padding: 20px;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
      color: #fff;
      font-size: 16px;
      font-weight: 300;
      letter-spacing: 4px;
      border: 1px solid rgba(255,255,255,0.2);
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .btn-go::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      100% { left: 100%; }
    }

    .btn-go:hover {
      background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.08));
      border-color: rgba(255,255,255,0.4);
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(255,255,255,0.1);
    }

    .btn-go:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* 3D 命运之轮 */
    .wheel-section {
      display: none;
      perspective: 1000px;
    }

    .wheel-section.show {
      display: block;
    }

    .wheel-3d {
      width: 300px;
      height: 300px;
      margin: 40px auto;
      position: relative;
      transform-style: preserve-3d;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotateX(10deg); }
      50% { transform: translateY(-10px) rotateX(10deg); }
    }

    .wheel-3d.spinning {
      animation: spin3d 4s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    }

    @keyframes spin3d {
      0% { transform: rotateY(0) rotateX(10deg); }
      100% { transform: rotateY(var(--final-rotation)) rotateX(10deg); }
    }

    .cube-face {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 300;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.6);
      backdrop-filter: blur(10px);
    }

    /* 结果区域 */
    .result-section {
      display: none;
      text-align: center;
    }

    .result-section.show {
      display: block;
      animation: revealResult 1s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes revealResult {
      from { opacity: 0; transform: scale(0.8) rotateY(180deg); }
      to { opacity: 1; transform: scale(1) rotateY(0); }
    }

    .result-glow {
      width: 200px;
      height: 200px;
      margin: 0 auto 30px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: glow 2s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 60px rgba(255,255,255,0.2); }
      50% { box-shadow: 0 0 100px rgba(255,255,255,0.4); }
    }

    .result-emoji {
      font-size: 80px;
    }

    .result-text {
      font-size: 36px;
      font-weight: 200;
      letter-spacing: 4px;
      margin-bottom: 30px;
      background: linear-gradient(135deg, #fff, #aaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .wisdom-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 28px;
      margin-top: 20px;
    }

    .wisdom-text {
      font-size: 15px;
      line-height: 2;
      color: rgba(255,255,255,0.7);
      font-weight: 300;
      font-style: italic;
      letter-spacing: 1px;
    }

    .wisdom-author {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      margin-top: 16px;
      text-align: right;
      letter-spacing: 2px;
    }

    .btn-again {
      margin-top: 30px;
      background: transparent;
      color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 14px 40px;
    }

    .btn-again:hover {
      color: #fff;
      border-color: rgba(255,255,255,0.5);
    }

    /* 批量输入 */
    .batch-input textarea {
      width: 100%;
      padding: 16px 20px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      font-size: 14px;
      background: rgba(0,0,0,0.3);
      color: #fff;
      outline: none;
      resize: vertical;
      min-height: 80px;
      font-family: inherit;
      margin-bottom: 12px;
      transition: all 0.3s;
    }

    .batch-input textarea:focus {
      border-color: rgba(255,255,255,0.4);
    }

    .batch-input textarea::placeholder {
      color: rgba(255,255,255,0.25);
    }

    .quick-hint {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      margin-bottom: 12px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0;
      color: rgba(255,255,255,0.25);
      font-size: 11px;
      letter-spacing: 2px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    }

    /* 光粒子效果 */
    .particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    .particle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: rgba(255,255,255,0.6);
      border-radius: 50%;
      animation: particleFloat 8s linear infinite;
    }

    @keyframes particleFloat {
      0% { transform: translateY(100vh) scale(0); opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { transform: translateY(-100px) scale(1); opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="stars"></div>
  <div class="meteor"></div>
  <div class="meteor"></div>
  <div class="meteor"></div>
  <div class="particles" id="particles"></div>

  <div class="container">
    <a href="/games" class="back-link">&larr; 返回游戏中心</a>

    <h1 class="title">命运之轮</h1>
    <p class="subtitle">WHEEL OF DESTINY</p>

    <!-- 输入区 -->
    <div class="card" id="inputCard">
      <div class="input-section">
        <label>写下你的选择</label>

        <div class="batch-input">
          <textarea id="batchInput" placeholder="每行一个选项&#10;例如：&#10;去旅行&#10;换工作&#10;学新技能"></textarea>
          <div class="quick-hint">每行一个选项，点击批量添加</div>
          <button class="btn btn-add" style="width: 100%;" onclick="batchAdd()">批量添加</button>
        </div>

        <div class="divider">或逐个添加</div>

        <div class="input-row">
          <input type="text" id="optionInput" placeholder="输入选项，回车添加" maxlength="30">
          <button class="btn btn-add" onclick="addOption()">添加</button>
        </div>

        <div class="options-list" id="optionsList"></div>
        <div class="count-hint" id="countHint">已添加 0 个选项（至少需要 2 个）</div>

        <button class="btn btn-go" id="goBtn" disabled onclick="startWheel()">
          转动命运
        </button>
      </div>
    </div>

    <!-- 命运之轮 -->
    <div class="card wheel-section" id="wheelSection">
      <div class="wheel-3d" id="wheel3d"></div>
    </div>

    <!-- 结果 -->
    <div class="result-section" id="resultSection">
      <div class="result-glow">
        <div class="result-emoji" id="resultEmoji"></div>
      </div>
      <div class="result-text" id="resultText"></div>
      <div class="wisdom-card">
        <div class="wisdom-text" id="wisdomText"></div>
        <div class="wisdom-author" id="wisdomAuthor"></div>
      </div>
      <button class="btn btn-again" onclick="reset()">再次转动</button>
    </div>
  </div>

  <script>
    const options = [];

    const emojis = ['✨', '🌟', '💫', '⭐', '🌙', '☀️', '🔮', '🎯', '🌈', '🦋'];

    const wisdoms = [
      { text: '所谓选择，不过是给已经决定的事，一个正式的名义。', author: '' },
      { text: '人生没有正确的选择，我们只是在努力让选择变得正确。', author: '' },
      { text: '犹豫不决的背后，是两个同样好的选择。', author: '' },
      { text: '当你面临选择却不知如何选时，选那个让你更害怕的。', author: '' },
      { text: '每一个你犹豫的当下，都是未来你怀念的曾经。', author: '' },
      { text: '选择困难，说明你还有选择。这本身就是一种幸运。', author: '' },
      { text: '最好的选择，往往不是在选项中挑出来的，而是选完之后努力出来的。', author: '' },
      { text: '人生最大的遗憾，不是选错了，而是从未选过。', author: '' },
      { text: '当你不知道该往哪走时，任何方向都是前方。', author: '' },
      { text: '所有的选择都有遗憾，但不选择才有最大的遗憾。', author: '' },
      { text: '命运负责发牌，我们负责出牌。', author: '' },
      { text: '生活不是等暴风雨过去，而是学会在雨中跳舞。', author: '' },
      { text: '你以为你在做选择，其实选择也在塑造你。', author: '' },
      { text: '两条路分叉在树林里，我选择了人迹更少的那一条。', author: '弗罗斯特' },
      { text: '人生就像骑自行车，要保持平衡就得不断前行。', author: '爱因斯坦' },
      { text: '不要等到万事俱备才出发，因为那一天永远不会来。', author: '' },
      { text: '有时候，错误的选择带来的收获，比正确的选择更多。', author: '' },
      { text: '做决定的那一刻，才是你真正活着的时刻。', author: '' },
      { text: '选择就像抛硬币，抛出去的那一刻，你知道了自己期待什么。', author: '' },
      { text: '别怕选错，怕的是你连选的勇气都没有。', author: '' },
      { text: '路是走出来的，不是选出来的。但总得先选一条，才能走。', author: '' },
      { text: '人生没有标准答案，你的选择就是你的答案。', author: '' },
      { text: '当你犹豫要不要做一件事的时候，答案是肯定的。', author: '' },
      { text: '选择没有对错，只有适不适合当下的你。', author: '' },
      { text: '与其在选择中消耗精力，不如在行动中证明自己。', author: '' },
      { text: '人生就像导航，走错了可以重新规划路线，但别停在原地。', author: '' },
      { text: '做选择之前问自己：八十岁的我会怎么看这个选择？', author: '' },
      { text: '真正的智慧不是做出正确的选择，而是让选择变得正确。', author: '' },
      { text: '做决定的时候，想想这件事十年后还重要吗？', author: '' },
      { text: '选择就像开门，开哪扇都能进去，关键是进去之后做什么。', author: '' },
    ];

    // 创建光粒子
    function createParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.className = 'particle';
        particle.style.left = Math.random() * 100 + '%';
        particle.style.animationDelay = Math.random() * 8 + 's';
        particle.style.animationDuration = (6 + Math.random() * 4) + 's';
        container.appendChild(particle);
      }
    }
    createParticles();

    // 输入处理
    document.getElementById('optionInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        addOption();
      }
    });

    function addOption() {
      const input = document.getElementById('optionInput');
      const value = input.value.trim();
      if (!value || options.includes(value)) return;
      options.push(value);
      input.value = '';
      input.focus();
      renderOptions();
    }

    function batchAdd() {
      const textarea = document.getElementById('batchInput');
      const lines = textarea.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      lines.forEach(line => {
        if (!options.includes(line)) options.push(line);
      });
      textarea.value = '';
      renderOptions();
    }

    function removeOption(index) {
      options.splice(index, 1);
      renderOptions();
    }

    function renderOptions() {
      const list = document.getElementById('optionsList');
      list.innerHTML = options.map((opt, i) =>
        `<span class="option-tag">
          ${escapeHtml(opt)}
          <span class="remove" onclick="removeOption(${i})">&times;</span>
        </span>`
      ).join('');

      const count = options.length;
      const hint = document.getElementById('countHint');
      const btn = document.getElementById('goBtn');

      if (count < 2) {
        hint.textContent = `已添加 ${count} 个选项（至少需要 2 个）`;
        btn.disabled = true;
      } else {
        hint.textContent = `已添加 ${count} 个选项`;
        btn.disabled = false;
      }
    }

    // 3D 命运之轮
    function createWheel() {
      const wheel = document.getElementById('wheel3d');
      const size = 300;
      const colors = ['rgba(255,255,255,0.08)', 'rgba(255,255,255,0.04)'];
      
      let html = '';
      const segmentAngle = 360 / options.length;
      
      options.forEach((opt, i) => {
        const rotation = i * segmentAngle;
        const color = colors[i % 2];
        html += `
          <div class="cube-face" style="
            background: ${color};
            transform: rotateY(${rotation}deg) translateZ(150px);
          ">
            ${escapeHtml(opt.slice(0, 8))}
          </div>
        `;
      });
      
      wheel.innerHTML = html;
    }

    function startWheel() {
      if (options.length < 2) return;

      const wheelSection = document.getElementById('wheelSection');
      const wheel = document.getElementById('wheel3d');
      const resultSection = document.getElementById('resultSection');
      const goBtn = document.getElementById('goBtn');

      wheelSection.classList.add('show');
      resultSection.classList.remove('show');
      goBtn.disabled = true;

      createWheel();

      // 随机结果
      const finalIndex = Math.floor(Math.random() * options.length);
      const segmentAngle = 360 / options.length;
      const extraSpins = 5 + Math.floor(Math.random() * 3);
      const finalRotation = extraSpins * 360 + (360 - finalIndex * segmentAngle);

      // 开始旋转
      wheel.style.setProperty('--final-rotation', finalRotation + 'deg');
      wheel.classList.add('spinning');

      setTimeout(() => {
        showResult(options[finalIndex]);
      }, 4000);
    }

    function showResult(choice) {
      const resultSection = document.getElementById('resultSection');
      resultSection.classList.add('show');

      document.getElementById('resultEmoji').textContent = emojis[Math.floor(Math.random() * emojis.length)];
      document.getElementById('resultText').textContent = choice;

      const wisdom = wisdoms[Math.floor(Math.random() * wisdoms.length)];
      document.getElementById('wisdomText').textContent = `"${wisdom.text}"`;
      document.getElementById('wisdomAuthor').textContent = wisdom.author ? `— ${wisdom.author}` : '';

      document.getElementById('goBtn').disabled = false;
    }

    function reset() {
      document.getElementById('wheelSection').classList.remove('show');
      document.getElementById('resultSection').classList.remove('show');
      const wheel = document.getElementById('wheel3d');
      wheel.classList.remove('spinning');
      wheel.style.transform = '';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
