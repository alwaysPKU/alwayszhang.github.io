<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>遇事不决 PRO</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'SF Pro Display', -apple-system, 'PingFang SC', sans-serif;
      background: #000;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 星空背景 */
    .stars {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at center, #0a0a2e 0%, #000 100%);
      z-index: 0;
    }

    .stars::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-image: 
        radial-gradient(2px 2px at 20px 30px, #fff, transparent),
        radial-gradient(1px 1px at 40px 70px, rgba(255,255,255,0.8), transparent),
        radial-gradient(2px 2px at 90px 40px, #fff, transparent),
        radial-gradient(1px 1px at 130px 80px, rgba(255,255,255,0.6), transparent),
        radial-gradient(2px 2px at 160px 120px, #fff, transparent);
      background-size: 200px 200px;
      animation: twinkle 4s ease-in-out infinite;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .container {
      position: relative;
      z-index: 10;
      max-width: 600px;
      margin: 0 auto;
      padding: 24px 16px;
    }

    .back-link {
      display: inline-block;
      color: rgba(255,255,255,0.6);
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 20px;
    }

    .back-link:hover { color: #fff; }

    .title {
      text-align: center;
      font-size: 32px;
      font-weight: 300;
      margin-bottom: 8px;
      letter-spacing: 8px;
      background: linear-gradient(135deg, #fff 0%, #888 50%, #fff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      text-align: center;
      color: rgba(255,255,255,0.4);
      font-size: 12px;
      letter-spacing: 4px;
      margin-bottom: 40px;
    }

    .card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 28px;
      backdrop-filter: blur(20px);
      margin-bottom: 24px;
    }

    .input-section label {
      display: block;
      font-size: 13px;
      margin-bottom: 16px;
      color: rgba(255,255,255,0.6);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .batch-input textarea {
      width: 100%;
      padding: 16px 20px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      font-size: 14px;
      background: rgba(0,0,0,0.3);
      color: #fff;
      outline: none;
      resize: vertical;
      min-height: 100px;
      font-family: inherit;
      margin-bottom: 12px;
    }

    .batch-input textarea:focus {
      border-color: rgba(255,255,255,0.4);
    }

    .batch-input textarea::placeholder {
      color: rgba(255,255,255,0.25);
    }

    .quick-hint {
      font-size: 12px;
      color: rgba(255,255,255,0.3);
      margin-bottom: 12px;
    }

    .btn {
      padding: 16px 24px;
      border: none;
      border-radius: 16px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s;
      letter-spacing: 1px;
    }

    .btn-add {
      width: 100%;
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.8);
      border: 1px solid rgba(255,255,255,0.15);
    }

    .btn-add:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.3);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 16px;
      margin: 24px 0;
      color: rgba(255,255,255,0.25);
      font-size: 11px;
      letter-spacing: 2px;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
    }

    .input-row {
      display: flex;
      gap: 12px;
    }

    .input-row input {
      flex: 1;
      padding: 16px 20px;
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px;
      font-size: 15px;
      background: rgba(0,0,0,0.3);
      color: #fff;
      outline: none;
    }

    .input-row input:focus {
      border-color: rgba(255,255,255,0.4);
    }

    .input-row input::placeholder {
      color: rgba(255,255,255,0.25);
    }

    .btn-go {
      width: 100%;
      padding: 20px;
      background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.05));
      color: #fff;
      font-size: 16px;
      font-weight: 300;
      letter-spacing: 4px;
      border: 1px solid rgba(255,255,255,0.2);
      margin-top: 24px;
      position: relative;
      overflow: hidden;
    }

    .btn-go::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      100% { left: 100%; }
    }

    .btn-go:hover {
      background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.08));
      border-color: rgba(255,255,255,0.4);
      transform: translateY(-2px);
      box-shadow: 0 10px 40px rgba(255,255,255,0.1);
    }

    .btn-go:disabled {
      opacity: 0.3;
      cursor: not-allowed;
      transform: none;
    }

    /* 选项预览 */
    .options-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 16px;
      min-height: 40px;
    }

    .option-tag {
      padding: 8px 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      font-size: 13px;
      color: rgba(255,255,255,0.8);
      position: relative;
      transition: all 0.3s;
    }

    .option-tag:hover {
      background: rgba(255,255,255,0.1);
      border-color: rgba(255,255,255,0.25);
    }

    .option-tag .remove {
      position: absolute;
      top: -6px;
      right: -6px;
      width: 18px;
      height: 18px;
      background: rgba(255,100,100,0.8);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .option-tag:hover .remove {
      opacity: 1;
    }

    .count-hint {
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.35);
      margin-top: 12px;
    }

    /* 全屏球体动画 - 固定在屏幕中央 */
    .sphere-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }

    .sphere-overlay.show {
      display: flex;
    }

    /* 3D 球体容器 */
    .sphere-container {
      width: 300px;
      height: 300px;
      position: relative;
      perspective: 1000px;
    }

    .sphere {
      width: 100%;
      height: 100%;
      position: absolute;
      transform-style: preserve-3d;
      animation: sphereRotate 8s linear infinite;
    }

    .sphere.spinning {
      animation: sphereSpin 5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
    }

    @keyframes sphereRotate {
      from { transform: rotateY(0) rotateX(15deg); }
      to { transform: rotateY(360deg) rotateX(15deg); }
    }

    @keyframes sphereSpin {
      0% { transform: rotateY(0) rotateX(15deg); }
      100% { transform: rotateY(var(--final-rotation)) rotateX(var(--final-tilt)); }
    }

    /* 球体节点 */
    .sphere-node {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 60px;
      height: 30px;
      margin: -15px 0 0 -30px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 400;
      color: rgba(255,255,255,0.9);
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 15px;
      transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: default;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 10px;
    }

    .sphere-node.highlighted {
      background: rgba(255,255,255,0.9);
      color: #000;
      border-color: #fff;
      transform: scale(2.5) translateZ(100px);
      z-index: 100;
      box-shadow: 0 0 60px rgba(255,255,255,0.8), 0 0 120px rgba(255,255,255,0.4);
    }

    /* 连接线 */
    .sphere-line {
      position: absolute;
      top: 50%;
      left: 50%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
      transform-origin: 0 0;
    }

    /* 结果展示 */
    .result-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.95);
      z-index: 1001;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }

    .result-overlay.show {
      display: flex;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .result-content {
      text-align: center;
      animation: revealResult 1s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes revealResult {
      from { opacity: 0; transform: scale(0.3); }
      to { opacity: 1; transform: scale(1); }
    }

    .result-glow {
      width: 150px;
      height: 150px;
      margin: 0 auto 30px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: glow 2s ease-in-out infinite;
    }

    @keyframes glow {
      0%, 100% { box-shadow: 0 0 60px rgba(255,255,255,0.3); }
      50% { box-shadow: 0 0 100px rgba(255,255,255,0.5); }
    }

    .result-emoji {
      font-size: 64px;
    }

    .result-text {
      font-size: 36px;
      font-weight: 200;
      letter-spacing: 4px;
      margin-bottom: 30px;
      background: linear-gradient(135deg, #fff, #aaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .wisdom-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 24px;
      margin-top: 20px;
      max-width: 400px;
    }

    .wisdom-text {
      font-size: 15px;
      line-height: 2;
      color: rgba(255,255,255,0.7);
      font-weight: 300;
      font-style: italic;
    }

    .wisdom-author {
      font-size: 12px;
      color: rgba(255,255,255,0.4);
      margin-top: 16px;
      text-align: right;
      letter-spacing: 2px;
    }

    .btn-again {
      margin-top: 30px;
      background: transparent;
      color: rgba(255,255,255,0.6);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 14px 40px;
    }

    .btn-again:hover {
      color: #fff;
      border-color: rgba(255,255,255,0.5);
    }

    @media (max-width: 480px) {
      .sphere-container { width: 260px; height: 260px; }
      .sphere-node { width: 50px; height: 26px; font-size: 10px; }
      .result-text { font-size: 28px; }
    }
  </style>
</head>
<body>
  <div class="stars"></div>

  <div class="container">
    <a href="/games" class="back-link">&larr; 返回游戏中心</a>

    <h1 class="title">遇事不决 PRO</h1>
    <p class="subtitle">SPHERE OF DESTINY</p>

    <div class="card">
      <div class="input-section">
        <label>写下你的选择</label>

        <div class="batch-input">
          <textarea id="batchInput" placeholder="每行一个选项&#10;例如：&#10;去旅行&#10;换工作&#10;学新技能&#10;开始运动&#10;读一本书"></textarea>
          <div class="quick-hint">每行一个选项，点击批量添加</div>
          <button class="btn btn-add" onclick="batchAdd()">批量添加</button>
        </div>

        <div class="divider">或逐个添加</div>

        <div class="input-row">
          <input type="text" id="optionInput" placeholder="输入选项，回车添加" maxlength="20">
          <button class="btn btn-add" style="width: auto; padding: 16px 24px;" onclick="addOption()">添加</button>
        </div>

        <div class="options-preview" id="optionsPreview"></div>
        <div class="count-hint" id="countHint">已添加 0 个选项（至少需要 2 个）</div>

        <button class="btn btn-go" id="goBtn" disabled onclick="startSphere()">
          转动命运
        </button>
      </div>
    </div>
  </div>

  <!-- 全屏球体动画 -->
  <div class="sphere-overlay" id="sphereOverlay">
    <div class="sphere-container">
      <div class="sphere" id="sphere"></div>
    </div>
  </div>

  <!-- 全屏结果展示 -->
  <div class="result-overlay" id="resultOverlay">
    <div class="result-content">
      <div class="result-glow">
        <div class="result-emoji" id="resultEmoji"></div>
      </div>
      <div class="result-text" id="resultText"></div>
      <div class="wisdom-card">
        <div class="wisdom-text" id="wisdomText"></div>
        <div class="wisdom-author" id="wisdomAuthor"></div>
      </div>
      <button class="btn btn-again" onclick="reset()">再次转动</button>
    </div>
  </div>

    // 输入处理
    document.getElementById('optionInput').addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        addOption();
      }
    });

    function addOption() {
      const input = document.getElementById('optionInput');
      const value = input.value.trim();
      if (!value || options.includes(value)) return;
      options.push(value);
      input.value = '';
      input.focus();
      renderPreview();
    }

    function batchAdd() {
      const textarea = document.getElementById('batchInput');
      const lines = textarea.value.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      lines.forEach(line => {
        if (!options.includes(line)) options.push(line);
      });
      textarea.value = '';
      renderPreview();
    }

    function removeOption(index) {
      options.splice(index, 1);
      renderPreview();
    }

    function renderPreview() {
      const preview = document.getElementById('optionsPreview');
      preview.innerHTML = options.map((opt, i) =>
        `<div class="option-tag">
          ${escapeHtml(opt)}
          <span class="remove" onclick="removeOption(${i})">&times;</span>
        </div>`
      ).join('');

      const count = options.length;
      const hint = document.getElementById('countHint');
      const btn = document.getElementById('goBtn');

      if (count < 2) {
        hint.textContent = `已添加 ${count} 个选项（至少需要 2 个）`;
        btn.disabled = true;
      } else {
        hint.textContent = `已添加 ${count} 个选项`;
        btn.disabled = false;
      }
    }

    // 计算球面坐标（斐波那契球分布）
    function fibonacciSphere(n, radius) {
      const points = [];
      const phi = Math.PI * (3 - Math.sqrt(5)); // 黄金角

      for (let i = 0; i < n; i++) {
        const y = 1 - (i / (n - 1)) * 2; // y 从 1 到 -1
        const r = Math.sqrt(1 - y * y); // 半径
        const theta = phi * i; // 角度

        const x = Math.cos(theta) * r;
        const z = Math.sin(theta) * r;

        points.push({
          x: x * radius,
          y: y * radius,
          z: z * radius
        });
      }
      return points;
    }

    // 创建3D球体 - 每个选项复制多份
    function createSphere() {
      const sphere = document.getElementById('sphere');
      const radius = 140;
      
      // 每个选项复制的份数（确保总节点数适中，50-100个）
      const copiesPerOption = Math.max(3, Math.min(10, Math.ceil(60 / options.length)));
      const totalNodes = options.length * copiesPerOption;
      const points = fibonacciSphere(totalNodes, radius);

      let html = '';

      // 创建节点 - 每个选项复制多份
      options.forEach((opt, i) => {
        for (let copy = 0; copy < copiesPerOption; copy++) {
          const nodeIndex = i * copiesPerOption + copy;
          const p = points[nodeIndex];
          // 计算旋转角度
          const rotateY = Math.atan2(p.x, p.z) * 180 / Math.PI;
          const rotateX = -Math.asin(p.y / radius) * 180 / Math.PI;
          const translateZ = Math.sqrt(p.x * p.x + p.y * p.y + p.z * p.z);

          html += `
            <div class="sphere-node" 
                 data-option-index="${i}"
                 style="transform: rotateY(${rotateY}deg) rotateX(${rotateX}deg) translateZ(${translateZ}px);">
              ${escapeHtml(opt.slice(0, 4))}
            </div>
          `;
        }
      });

      sphere.innerHTML = html;
    }

    function startSphere() {
      if (options.length < 2) return;

      const overlay = document.getElementById('sphereOverlay');
      const sphere = document.getElementById('sphere');
      const goBtn = document.getElementById('goBtn');

      overlay.classList.add('show');
      goBtn.disabled = true;

      createSphere();

      // 随机结果
      const finalIndex = Math.floor(Math.random() * options.length);
      const extraSpins = 3 + Math.floor(Math.random() * 3);
      const finalRotation = extraSpins * 360 + Math.random() * 360;
      const finalTilt = 15 + Math.random() * 20;

      // 开始旋转
      sphere.style.setProperty('--final-rotation', finalRotation + 'deg');
      sphere.style.setProperty('--final-tilt', finalTilt + 'deg');
      sphere.classList.add('spinning');

      // 旋转结束后高亮选中节点（高亮所有复制的节点）
      setTimeout(() => {
        const nodes = document.querySelectorAll(`.sphere-node[data-option-index="${finalIndex}"]`);
        nodes.forEach(node => {
          node.classList.add('highlighted');
        });
      }, 4500);

      // 显示结果
      setTimeout(() => {
        overlay.classList.remove('show');
        showResult(options[finalIndex]);
      }, 6000);
    }

    function showResult(choice) {
      const resultOverlay = document.getElementById('resultOverlay');
      resultOverlay.classList.add('show');

      document.getElementById('resultEmoji').textContent = emojis[Math.floor(Math.random() * emojis.length)];
      document.getElementById('resultText').textContent = choice;

      const wisdom = wisdoms[Math.floor(Math.random() * wisdoms.length)];
      document.getElementById('wisdomText').textContent = `"${wisdom.text}"`;
      document.getElementById('wisdomAuthor').textContent = wisdom.author ? `— ${wisdom.author}` : '';

      document.getElementById('goBtn').disabled = false;
    }

    function reset() {
      document.getElementById('resultOverlay').classList.remove('show');
      const sphere = document.getElementById('sphere');
      sphere.classList.remove('spinning');
      sphere.style.transform = '';
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
